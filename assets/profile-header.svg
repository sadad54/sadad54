<text x="40" y="165" font-family="Arial,sans-serif" font-size="86" font-weight="700" letter-spacing="-4" fill="#f5f2ff">hey, i'm <tspan fill="#bfa7ff">sadad.</tspan></text>
<text x="45" y="219" font-family="Arial,sans-serif" font-size="29" fill="#d9dced">AI, full-stack &amp; a few side quests.</text>
<text x="45" y="295" font-family="monospace" font-size="17" fill="#87e7ce">&gt; turning “what if” into git push_</text>
