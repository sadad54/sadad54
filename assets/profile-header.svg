<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Hey, I'm Sadad!</title><desc id="desc">AI, full-stack, and a few side quests. A cheerful floating terminal robot surrounded by colorful stars.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#19172e"/><stop offset="1" stop-color="#111c2a"/></linearGradient><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#bfa7ff" stroke-opacity=".07"/></pattern></defs>
<style>.float{animation:bob 5s ease-in-out infinite;transform-origin:1000px 180px}.star{animation:twinkle 4s ease-in-out infinite}.second{animation-delay:2s}@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(3deg)}}@keyframes twinkle{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.float,.star{animation:none}}</style>
<rect width="1200" height="350" rx="24" fill="url(#bg)"/><rect width="1200" height="350" rx="24" fill="url(#grid)"/>
<circle cx="1130" cy="18" r="190" fill="#bfa7ff" opacity=".045"/>
