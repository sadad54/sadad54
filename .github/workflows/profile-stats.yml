name: Refresh profile stats
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - .github/workflows/profile-stats.yml
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate public stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stats.py
      - name: Commit refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/github-stats.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public profile stats"
            git push
          fi
